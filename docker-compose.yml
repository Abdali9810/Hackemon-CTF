# Puertos publicados solo en 127.0.0.1 (modo local/per-estudiante).
# Para modo servidor central cambia 127.0.0.1 por 0.0.0.0 en cada puerto.
services:
  mundo:
    build: .
    image: hackemon-ctf:latest
    container_name: ctf-mundo
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      - ADMIN_TR_PASS=${ADMIN_TR_PASS:-}   # contraseña del usuario Admin-TR (vacía = ContraseñaTR)
    ports:
      - "127.0.0.1:8080:8080"   # juego principal
      - "127.0.0.1:8081:8081"   # objetivo web (retos 10, 11)
      - "127.0.0.1:9003:9003"   # simulador FTP (reto 4)
