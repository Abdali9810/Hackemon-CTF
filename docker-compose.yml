# Todo se publica SOLO en 127.0.0.1: el laboratorio no queda expuesto a tu red.
services:
  mundo:
    build: .
    container_name: ctf-mundo
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      - ADMIN_TR_PASS=${ADMIN_TR_PASS:-}   # contraseña del usuario Admin-TR (vacía = ContraseñaTR)
    volumes:
      - ./app/static:/app/static        # edita el juego (index.html) y solo refresca el navegador
    ports:
      - "127.0.0.1:8080:8080"        # el juego
      - "127.0.0.1:8081:8081"        # objetivo web (retos 3, 10, 11)
      - "127.0.0.1:9001-9010:9001-9010"  # reto 1
      - "127.0.0.1:7001-7003:7001-7003"  # reto 12 (golpes)
      - "127.0.0.1:7100:7100"        # reto 12 (puerta)
